<svg xmlns="http://www.w3.org/2000/svg" width="430" height="980" viewBox="0 0 430 980" role="img" aria-labelledby="title desc">
  <title id="title">ACNH Diary 화석 상세 화면</title>
  <desc id="desc">호박 화석의 이미지, 판매가, fossil group, 크기, 상호작용 여부, 보유/기증 상태를 보여주는 상세 화면</desc>
  <defs>
    <linearGradient id="page-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF9E8"/><stop offset="1" stop-color="#F3E8D4"/></linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#70562F" flood-opacity="0.09"/></filter>
    <symbol id="icon-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="m7.5 12.2 3 3.1 6-7" fill="none" stroke="#FFFDF7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-owl" viewBox="0 0 24 24"><path d="M5 10c0-4 3-7 7-7s7 3 7 7v7.5c0 2-1.5 3.5-3.5 3.5h-7C6.5 21 5 19.5 5 17.5Z" fill="currentColor"/><circle cx="9.2" cy="10.5" r="2.2" fill="#FFFDF7"/><circle cx="14.8" cy="10.5" r="2.2" fill="#FFFDF7"/><path d="m10.5 14 1.5 1.6 1.5-1.6Z" fill="#FFFDF7"/></symbol>
    <symbol id="item-fossil" viewBox="0 0 96 96"><path d="M20 74c-10-12-8-34 4-46 16-16 44-16 54 2 10 18-2 44-24 50-10 2-20 0-34-6Z" fill="currentColor"/><path d="M34 60c20 0 34-12 34-34M36 40l-8-8M54 56l10 10" stroke="#FFFDF7" stroke-width="5" stroke-linecap="round"/></symbol>
  </defs>
  <g id="Screen/Encyclopedia/FossilDetail" font-family="Inter, Noto Sans KR, sans-serif">
    <rect width="430" height="980" fill="url(#page-bg)"/><circle cx="366" cy="78" r="112" fill="#F2E5D4" fill-opacity=".8"/>
    <g id="Header" transform="translate(24 20)"><g role="button" tabindex="0"><title>화석 목록으로 돌아가기</title><rect width="40" height="34" rx="17" fill="#FFFDF7" stroke="#EAD9B8"/><path d="M24 11 16 17l8 6" fill="none" stroke="#6D4B25" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="54" y="22" fill="#8A735A" font-size="12" font-weight="900">도감</text><path d="m87 13 5 5-5 5" fill="none" stroke="#B8A284" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><rect x="104" y="2" width="62" height="30" rx="15" fill="#F2E5D4" stroke="#D8C9AA"/><text x="135" y="22" text-anchor="middle" fill="#8A5C32" font-size="12" font-weight="900">화석</text><path d="m180 13 5 5-5 5" fill="none" stroke="#B8A284" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="198" y="22" fill="#6D4B25" font-size="12" font-weight="900">호박</text><g id="HamburgerMenu" transform="translate(342 0)" role="button" tabindex="0"><title>전체 메뉴 열기</title><rect width="40" height="34" rx="17" fill="#FFFDF7" stroke="#EAD9B8"/><path d="M12 11h16M12 17h16M12 23h16" fill="none" stroke="#6D4B25" stroke-width="2" stroke-linecap="round"/></g><text x="0" y="80" fill="#8A735A" font-size="12" font-weight="900">001</text><text x="0" y="112" fill="#3E2E1F" font-size="30" font-weight="900">호박</text></g>
    <g id="Hero" transform="translate(32 148)" filter="url(#soft-shadow)"><rect width="366" height="238" rx="22" fill="#FFFDF7" stroke="#EAD9B8"/><rect x="18" y="18" width="330" height="138" rx="16" fill="#F7F0DE" stroke="#D8C9AA"/><use href="#item-fossil" x="136" y="42" width="96" height="96" color="#C99245"/><g transform="translate(78 174)" font-size="12" font-weight="900"><g role="button" tabindex="0"><title>보유 여부 토글</title><rect width="92" height="38" rx="19" fill="#F2E5D4"/><use href="#icon-check" x="14" y="9" width="20" height="20" color="#B9906A"/><text x="44" y="25" fill="#8A5C32">보유 완료</text></g><g transform="translate(112)" role="button" tabindex="0"><title>박물관 기증 여부 토글</title><rect width="106" height="38" rx="19" fill="#FFF0C9"/><use href="#icon-owl" x="14" y="9" width="20" height="20" color="#D39C25"/><text x="44" y="25" fill="#8A641C">박물관 기증</text></g></g></g>
    <g id="Info" transform="translate(32 410)" filter="url(#soft-shadow)"><rect width="366" height="230" rx="18" fill="#FFFDF7" stroke="#EAD9B8"/><text x="18" y="31" fill="#3E2E1F" font-size="17" font-weight="900">상세 정보</text><g font-size="12"><text x="18" y="64" fill="#8A735A" font-weight="800">판매가</text><text x="128" y="64" fill="#3E2E1F" font-weight="900">1,200벨</text><path d="M18 82h330" stroke="#EAD9B8"/><text x="18" y="106" fill="#8A735A" font-weight="800">fossil_group</text><text x="128" y="106" fill="#3E2E1F" font-weight="900">amber</text><path d="M18 124h330" stroke="#EAD9B8"/><text x="18" y="148" fill="#8A735A" font-weight="800">크기</text><text x="128" y="148" fill="#3E2E1F" font-weight="900">1.0 x 1.0</text><path d="M18 166h330" stroke="#EAD9B8"/><text x="18" y="190" fill="#8A735A" font-weight="800">상호작용 여부</text><g transform="translate(128 174)"><rect width="76" height="28" rx="14" fill="#FFF8EA" stroke="#D8C9AA"/><text x="38" y="19" text-anchor="middle" fill="#6D4B25" font-weight="900">불가</text></g></g></g>
    <g id="Description" transform="translate(32 662)" filter="url(#soft-shadow)"><rect width="366" height="210" rx="18" fill="#FFFDF7" stroke="#EAD9B8"/><text x="18" y="31" fill="#3E2E1F" font-size="17" font-weight="900">박물관 설명</text><text x="18" y="62" fill="#8A735A" font-size="11" font-weight="800">고대 나무의 수지가 오랜 시간 굳어 만들어진 화석입니다.</text><text x="18" y="84" fill="#8A735A" font-size="11" font-weight="800">아름다움 때문에 장신구와 교역품으로도 쓰였고,</text><text x="18" y="106" fill="#8A735A" font-size="11" font-weight="800">안에 갇힌 곤충이나 식물은 오래전 환경을 알려줍니다.</text></g>
  </g>
</svg>
