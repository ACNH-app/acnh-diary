<svg xmlns="http://www.w3.org/2000/svg" width="430" height="1290" viewBox="0 0 430 1290" role="img" aria-labelledby="title desc">
  <title id="title">ACNH Diary 물고기 상세 화면</title>
  <desc id="desc">납줄개의 이미지, 출현 조건, 가격, 크기, 캐치프레이즈, 채집/기증 상태와 tank 정보를 보여주는 물고기 상세 화면</desc>
