<svg xmlns="http://www.w3.org/2000/svg" width="430" height="860" viewBox="0 0 430 860" role="img" aria-labelledby="title desc">
  <title id="title">ACNH Diary 물고기 도감 목록 화면</title>
  <desc id="desc">물고기 도감의 breadcrumb 상단 바, 필터 컨트롤, 그리드 상단 검색창을 보여주는 모바일 화면</desc>
