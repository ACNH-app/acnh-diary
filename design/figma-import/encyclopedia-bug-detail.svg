<svg xmlns="http://www.w3.org/2000/svg" width="430" height="1290" viewBox="0 0 430 1290" role="img" aria-labelledby="title desc">
  <title id="title">ACNH Diary 곤충 상세 화면</title>
  <desc id="desc">배추흰나비의 이미지, 출현 조건, 가격, 캐치프레이즈, 채집/기증 상태와 tank 정보를 보여주는 곤충 상세 화면</desc>
  <defs>
    <linearGradient id="page-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF9E8"/><stop offset="1" stop-color="#F3E8D4"/></linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#70562F" flood-opacity="0.09"/></filter>
    <symbol id="icon-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="m7.5 12.2 3 3.1 6-7" fill="none" stroke="#FFFDF7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-owl" viewBox="0 0 24 24"><path d="M5 10c0-4 3-7 7-7s7 3 7 7v7.5c0 2-1.5 3.5-3.5 3.5h-7C6.5 21 5 19.5 5 17.5Z" fill="currentColor"/><circle cx="9.2" cy="10.5" r="2.2" fill="#FFFDF7"/><circle cx="14.8" cy="10.5" r="2.2" fill="#FFFDF7"/><path d="m10.5 14 1.5 1.6 1.5-1.6Z" fill="#FFFDF7"/></symbol>
    <symbol id="bug-butterfly" viewBox="0 0 96 96"><path d="M44 48C24 12 6 20 12 48c4.6 20.4 24 15.6 32 0Z" fill="currentColor"/><path d="M52 48C72 12 90 20 84 48c-4.6 20.4-24 15.6-32 0Z" fill="currentColor"/><ellipse cx="48" cy="50" rx="5" ry="18" fill="#3E2E1F"/><path d="M44 32c-8-8-14-10-20-8M52 32c8-8 14-10 20-8" fill="none" stroke="#3E2E1F" stroke-width="3" stroke-linecap="round"/></symbol>
  </defs>

  <g id="Screen/Encyclopedia/BugDetail" font-family="Inter, Noto Sans KR, sans-serif">
    <rect width="430" height="1290" fill="url(#page-bg)"/>
    <circle cx="366" cy="78" r="112" fill="#FFE7E4" fill-opacity=".76"/>

    <g id="Header" transform="translate(24 20)">
      <g id="BackButton" role="button" tabindex="0">
        <title>곤충 목록으로 돌아가기</title>
        <rect width="40" height="34" rx="17" fill="#FFFDF7" stroke="#EAD9B8"/>
        <path d="M24 11 16 17l8 6" fill="none" stroke="#6D4B25" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="54" y="22" fill="#8A735A" font-size="12" font-weight="900">도감</text>
      <path d="m87 13 5 5-5 5" fill="none" stroke="#B8A284" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="104" y="2" width="62" height="30" rx="15" fill="#E8F8EF" stroke="#B8D7C2"/>
      <text x="135" y="22" text-anchor="middle" fill="#2F7D4C" font-size="12" font-weight="900">곤충</text>
      <path d="m180 13 5 5-5 5" fill="none" stroke="#B8A284" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="198" y="22" fill="#6D4B25" font-size="12" font-weight="900">배추흰나비</text>
      <g id="HamburgerMenu" transform="translate(342 0)" role="button" tabindex="0">
        <title>전체 메뉴 열기</title>
        <rect width="40" height="34" rx="17" fill="#FFFDF7" stroke="#EAD9B8"/>
        <path d="M12 11h16M12 17h16M12 23h16" fill="none" stroke="#6D4B25" stroke-width="2" stroke-linecap="round"/>
      </g>
      <text x="0" y="80" fill="#8A735A" font-size="12" font-weight="900">001</text>
      <text x="0" y="112" fill="#3E2E1F" font-size="30" font-weight="900">배추흰나비</text>
    </g>

    <g id="Hero" transform="translate(32 148)" filter="url(#soft-shadow)">
      <rect width="366" height="238" rx="22" fill="#FFFDF7" stroke="#EAD9B8"/>
      <rect x="18" y="18" width="330" height="138" rx="16" fill="#F8FBEA" stroke="#C9D8B7"/>
      <use href="#bug-butterfly" x="136" y="38" width="96" height="96" color="#F2F0DD"/>
      <g id="StatusToggles" transform="translate(78 174)" font-size="12" font-weight="900">
        <g role="button" tabindex="0">
          <title>채집 여부 토글</title>
          <rect width="92" height="38" rx="19" fill="#E8F8EF"/>
          <use href="#icon-check" x="14" y="9" width="20" height="20" color="#63B879"/>
          <text x="44" y="25" fill="#2F7D4C">채집 완료</text>
        </g>
        <g transform="translate(112)" role="button" tabindex="0">
          <title>박물관 기증 여부 토글</title>
          <rect width="106" height="38" rx="19" fill="#FFF0C9"/>
          <use href="#icon-owl" x="14" y="9" width="20" height="20" color="#D39C25"/>
          <text x="44" y="25" fill="#8A641C">박물관 기증</text>
        </g>
      </g>
    </g>

    <g id="AppearanceInfo" transform="translate(32 410)" filter="url(#soft-shadow)">
      <rect width="366" height="354" rx="18" fill="#FFFDF7" stroke="#EAD9B8"/>
      <text x="18" y="31" fill="#3E2E1F" font-size="17" font-weight="900">출현 정보</text>
      <g font-size="12">
        <text x="18" y="64" fill="#8A735A" font-weight="800">출현 장소</text>
        <text x="128" y="64" fill="#3E2E1F" font-weight="900">하늘을 날아다님</text>
        <path d="M18 82h330" stroke="#EAD9B8"/>
        <text x="18" y="106" fill="#8A735A" font-weight="800">조건 / 날씨</text>
        <text x="128" y="106" fill="#3E2E1F" font-weight="900">비가 오지 않는 날</text>
        <path d="M18 124h330" stroke="#EAD9B8"/>
        <text x="18" y="150" fill="#8A735A" font-weight="800">북반구 출현 월</text>
        <g id="NorthernMonths" transform="translate(18 164)" font-size="10" font-weight="900" text-anchor="middle">
          <g><rect width="25" height="24" rx="12" fill="#E8F8EF" stroke="#75B65D"/><text x="12.5" y="16" fill="#4C7D37">1월</text></g>
          <g transform="translate(27)"><rect width="25" height="24" rx="12" fill="#E8F8EF" stroke="#75B65D"/><text x="12.5" y="16" fill="#4C7D37">2월</text></g>
          <g transform="translate(54)"><rect width="25" height="24" rx="12" fill="#E8F8EF" stroke="#75B65D"/><text x="12.5" y="16" fill="#4C7D37">3월</text></g>
          <g transform="translate(81)"><rect width="25" height="24" rx="12" fill="#E8F8EF" stroke="#75B65D"/><text x="12.5" y="16" fill="#4C7D37">4월</text></g>
          <g transform="translate(108)"><rect width="25" height="24" rx="12" fill="#E8F8EF" stroke="#75B65D"/><text x="12.5" y="16" fill="#4C7D37">5월</text></g>
          <g transform="translate(135)"><rect width="25" height="24" rx="12" fill="#E8F8EF" stroke="#75B65D"/><text x="12.5" y="16" fill="#4C7D37">6월</text></g>
          <g transform="translate(162)"><rect width="25" height="24" rx="12" fill="#EEF0E7" stroke="#D8DDCD"/><text x="12.5" y="16" fill="#9AA18D">7월</text></g>
          <g transform="translate(189)"><rect width="25" height="24" rx="12" fill="#EEF0E7" stroke="#D8DDCD"/><text x="12.5" y="16" fill="#9AA18D">8월</text></g>
          <g transform="translate(216)"><rect width="25" height="24" rx="12" fill="#E8F8EF" stroke="#75B65D"/><text x="12.5" y="16" fill="#4C7D37">9월</text></g>
          <g transform="translate(243)"><rect width="25" height="24" rx="12" fill="#E8F8EF" stroke="#75B65D"/><text x="12.5" y="16" fill="#4C7D37">10월</text></g>
          <g transform="translate(270)"><rect width="25" height="24" rx="12" fill="#E8F8EF" stroke="#75B65D"/><text x="12.5" y="16" fill="#4C7D37">11월</text></g>
          <g transform="translate(297)"><rect width="25" height="24" rx="12" fill="#E8F8EF" stroke="#75B65D"/><text x="12.5" y="16" fill="#4C7D37">12월</text></g>
        </g>
        <path d="M18 206h330" stroke="#EAD9B8"/>
        <text x="18" y="232" fill="#8A735A" font-weight="800">북반구 출현 시간</text>
        <g id="NorthernHours" transform="translate(18 248)" font-size="9.5" font-weight="900">
          <rect x="0" y="0" width="330" height="12" rx="3" fill="#E7E9DD"/>
          <rect x="55" y="0" width="206" height="12" fill="#75B65D"/>
          <g stroke="#FFFDF7" stroke-width="1">
            <path d="M13.75 0v12M27.5 0v12M41.25 0v12M55 0v12M68.75 0v12M82.5 0v12M96.25 0v12M110 0v12M123.75 0v12M137.5 0v12M151.25 0v12M165 0v12M178.75 0v12M192.5 0v12M206.25 0v12M220 0v12M233.75 0v12M247.5 0v12M261.25 0v12M275 0v12M288.75 0v12M302.5 0v12M316.25 0v12"/>
          </g>
          <g stroke="#BFC7B5" stroke-width="1">
            <path d="M0 16v8M41.25 16v8M82.5 16v8M123.75 16v8M165 16v8M206.25 16v8M247.5 16v8M288.75 16v8M330 16v8"/>
          </g>
          <text x="0" y="40" fill="#4C7D37">12am</text>
          <text x="37" y="40" fill="#4C7D37">3am</text>
          <text x="78" y="40" fill="#4C7D37">6am</text>
          <text x="120" y="40" fill="#4C7D37">9am</text>
          <text x="160" y="40" fill="#4C7D37">12pm</text>
          <text x="202" y="40" fill="#4C7D37">3pm</text>
          <text x="244" y="40" fill="#4C7D37">6pm</text>
          <text x="286" y="40" fill="#4C7D37">9pm</text>
        </g>
        <path d="M18 316h330" stroke="#EAD9B8"/>
        <text x="18" y="340" fill="#8A735A" font-weight="800">출현빈도</text>
        <text x="128" y="340" fill="#3E2E1F" font-weight="900">흔함</text>
      </g>
    </g>

    <g id="PriceInfo" transform="translate(32 786)" filter="url(#soft-shadow)">
      <rect width="366" height="110" rx="18" fill="#FFFDF7" stroke="#EAD9B8"/>
      <text x="18" y="31" fill="#3E2E1F" font-size="17" font-weight="900">판매가격</text>
      <g transform="translate(18 50)" font-size="12" font-weight="900">
        <rect width="154" height="42" rx="12" fill="#FFF8EA" stroke="#D8C9AA"/>
        <text x="14" y="17" fill="#8A735A">너굴상점</text>
        <text x="14" y="33" fill="#3E2E1F">160벨</text>
        <g transform="translate(176)">
          <rect width="154" height="42" rx="12" fill="#FFF8EA" stroke="#D8C9AA"/>
          <text x="14" y="17" fill="#8A735A">레온</text>
          <text x="14" y="33" fill="#3E2E1F">240벨</text>
        </g>
      </g>
    </g>

    <g id="CatchPhrase" transform="translate(32 918)" filter="url(#soft-shadow)">
      <rect width="366" height="112" rx="18" fill="#FFFDF7" stroke="#EAD9B8"/>
      <text x="18" y="31" fill="#3E2E1F" font-size="17" font-weight="900">캐치프레이즈</text>
      <text x="18" y="62" fill="#6D4B25" font-size="12" font-weight="900">배추흰나비를 잡았다!</text>
      <text x="18" y="84" fill="#8A735A" font-size="11" font-weight="800">I caught a common butterfly!</text>
    </g>

    <g id="TankInfo" transform="translate(32 1052)" filter="url(#soft-shadow)">
      <rect width="366" height="184" rx="18" fill="#FFFDF7" stroke="#EAD9B8"/>
      <text x="18" y="31" fill="#3E2E1F" font-size="17" font-weight="900">Tank</text>
      <rect x="18" y="52" width="156" height="106" rx="14" fill="#E7F7F7" stroke="#BBD9D5"/>
      <rect x="42" y="72" width="108" height="62" rx="8" fill="#D8F0F1" stroke="#7DBEC2"/>
      <use href="#bug-butterfly" x="78" y="81" width="38" height="38" color="#F2F0DD"/>
      <text x="196" y="72" fill="#8A735A" font-size="12" font-weight="800">tank 사이즈</text>
      <text x="196" y="96" fill="#3E2E1F" font-size="16" font-weight="900">1 x 1</text>
      <text x="196" y="126" fill="#8A735A" font-size="12" font-weight="800">작은 곤충 케이스 이미지</text>
    </g>
  </g>
</svg>
