<svg xmlns="http://www.w3.org/2000/svg" width="430" height="1920" viewBox="0 0 430 1920" role="img" aria-labelledby="title desc">
  <title id="title">ACNH Diary 주민 상세 정보 스크롤 화면</title>
  <desc id="desc">쭈니 주민 상세 페이지의 상단 기본 정보와 전체 상세 정보를 보여주는 스크롤형 SVG 시안</desc>
  <defs>
    <linearGradient id="page-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF9E8"/>
      <stop offset=".55" stop-color="#FFFDF7"/>
      <stop offset="1" stop-color="#F2E8D4"/>
    </linearGradient>
    <linearGradient id="portrait-bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#DCEFFF"/>
      <stop offset="1" stop-color="#EFE1FF"/>
    </linearGradient>
    <filter id="soft-shadow" x="-12%" y="-12%" width="124%" height="136%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#6A4F2C" flood-opacity=".09"/>
    </filter>
    <clipPath id="portrait-clip"><rect x="0" y="0" width="156" height="156" rx="36"/></clipPath>

    <symbol id="icon-heart" viewBox="0 0 24 24">
      <path d="M12 20S4 15.4 4 9.2C4 5 9.4 3.7 12 7.2 14.6 3.7 20 5 20 9.2 20 15.4 12 20 12 20Z" fill="currentColor"/>
    </symbol>
    <symbol id="icon-house" viewBox="0 0 24 24">
      <path d="M3.5 11.2 12 4l8.5 7.2V20H15v-5.6H9V20H3.5Z" fill="currentColor"/>
      <path d="M8 10.8h8" stroke="#FFFDF7" stroke-width="1.4" stroke-linecap="round" opacity=".75"/>
    </symbol>
    <symbol id="icon-camp" viewBox="0 0 24 24">
      <path d="m3 20 9-16 9 16Z" fill="currentColor"/>
      <path d="m7.5 20 4.5-8 4.5 8M12 12v8" fill="none" stroke="#FFFDF7" stroke-width="1.5" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-box" viewBox="0 0 24 24">
      <path d="m3.5 7.5 8.5-4 8.5 4-8.5 4Z" fill="currentColor"/>
      <path d="M3.5 7.5V17l8.5 4v-9.5ZM20.5 7.5V17L12 21v-9.5Z" fill="currentColor" opacity=".78"/>
      <path d="M8 5.4 16.5 9" stroke="#FFFDF7" stroke-width="1.2" opacity=".8"/>
    </symbol>
    <symbol id="icon-photo" viewBox="0 0 24 24">
      <rect x="3" y="5" width="18" height="15" rx="3" fill="currentColor"/>
      <circle cx="9" cy="10" r="2" fill="#FFFDF7"/>
      <path d="m5.5 18 4.5-4 3.2 2.5 2.8-3 3.5 4.5" fill="none" stroke="#FFFDF7" stroke-width="1.5" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-note" viewBox="0 0 24 24">
      <path d="M9 18.5a3 3 0 1 1-2-2.83V6.2l10-2.1v10.4a3 3 0 1 1-2-2.83V7.2l-6 1.25Z" fill="currentColor"/>
    </symbol>
    <symbol id="icon-shirt" viewBox="0 0 24 24">
      <path d="M8 4 5 6.2 2.8 11 6.5 13l1-2.2V20h9V10.8l1 2.2 3.7-2-2.2-4.8L16 4c-1.1 1.2-2.3 1.8-4 1.8S9.1 5.2 8 4Z" fill="currentColor"/>
    </symbol>
    <symbol id="icon-umbrella" viewBox="0 0 24 24">
      <path d="M3 11a9 9 0 0 1 18 0H3Z" fill="currentColor"/>
      <path d="M12 11v6.3a2.7 2.7 0 0 0 5.4 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
  </defs>

  <g id="Screen/Residents/DetailScroll" font-family="Inter, Noto Sans KR, sans-serif">
    <rect width="430" height="1920" fill="url(#page-bg)"/>
    <circle cx="368" cy="82" r="110" fill="#FFE6E1" fill-opacity=".64"/>
    <circle cx="46" cy="1830" r="112" fill="#D8EFE8" fill-opacity=".58"/>

    <g id="CloseButton" transform="translate(358 18)" role="button" tabindex="0">
      <title>닫기</title>
      <rect width="46" height="34" rx="17" fill="#F2E5CC"/>
      <text x="23" y="22" text-anchor="middle" fill="#6D4B25" font-size="11" font-weight="900">닫기</text>
    </g>

    <g id="ProfileSummary" transform="translate(0 44)">
      <g id="Portrait" transform="translate(137 0)">
        <rect width="156" height="156" rx="36" fill="url(#portrait-bg)"/>
        <g clip-path="url(#portrait-clip)">
          <image href="../../docs/villager-tracker/assets/villagers/squ17.png" x="8" y="4" width="140" height="148" preserveAspectRatio="xMidYMid meet"/>
        </g>
      </g>

      <text x="215" y="198" text-anchor="middle" fill="#6D4B25" font-size="30" font-weight="900">쭈니</text>
      <text x="215" y="222" text-anchor="middle" fill="#8A735A" font-size="12" font-weight="800">다람쥐 · 느끼함 · A</text>
      <text x="215" y="243" text-anchor="middle" fill="#B26F53" font-size="12" font-weight="900">생일 9월 29일 · 천칭자리</text>

      <g id="StatusIcons" transform="translate(128 264)">
        <g id="Status/Wish" role="button" tabindex="0">
          <title>하트: 위시 주민</title>
          <rect width="28" height="28" rx="14" fill="#FFE7EE"/>
          <use href="#icon-heart" x="8" y="8" width="12" height="12" color="#F04B76"/>
        </g>
        <g id="Status/Island" transform="translate(36)" role="button" tabindex="0">
          <title>집: 섬 주민</title>
          <rect width="28" height="28" rx="14" fill="#FFFDF7" stroke="#EAD9B8"/>
          <use href="#icon-house" x="8" y="8" width="12" height="12" color="#C8B89F"/>
        </g>
        <g id="Status/Camping" transform="translate(72)" role="button" tabindex="0">
          <title>캠핑장 방문</title>
          <rect width="28" height="28" rx="14" fill="#FFFDF7" stroke="#EAD9B8"/>
          <use href="#icon-camp" x="8" y="8" width="12" height="12" color="#C8B89F"/>
        </g>
        <g id="Status/MoveBox" transform="translate(108)" role="button" tabindex="0">
          <title>이사박스</title>
          <rect width="28" height="28" rx="14" fill="#FFFDF7" stroke="#EAD9B8"/>
          <use href="#icon-box" x="8" y="8" width="12" height="12" color="#C8B89F"/>
        </g>
        <g id="Status/FramedPhoto" transform="translate(144)" role="button" tabindex="0">
          <title>액자선물</title>
          <rect width="28" height="28" rx="14" fill="#FFFDF7" stroke="#EAD9B8"/>
          <use href="#icon-photo" x="8" y="8" width="12" height="12" color="#C8B89F"/>
        </g>
      </g>
    </g>

    <g id="BasicInfoSection" transform="translate(16 364)">
      <text x="0" y="0" fill="#3E2E1F" font-size="16" font-weight="900">기본 정보</text>
      <g transform="translate(0 18)" filter="url(#soft-shadow)">
        <rect width="398" height="122" rx="16" fill="#FFFDF7" stroke="#EAD9B8"/>
        <g font-size="11.5">
          <text x="18" y="34" fill="#8A735A" font-weight="800">성별</text>
          <text x="146" y="34" fill="#3E2E1F" font-weight="900">남성</text>
          <path d="M18 48h362" stroke="#EAD9B8"/>
          <text x="18" y="72" fill="#8A735A" font-weight="800">활동시간</text>
          <text x="146" y="72" fill="#3E2E1F" font-weight="900">07:00-02:00</text>
          <path d="M18 86h362" stroke="#EAD9B8"/>
          <text x="18" y="110" fill="#8A735A" font-weight="800">취미</text>
          <text x="146" y="110" fill="#3E2E1F" font-weight="900">음악</text>
        </g>
      </g>
    </g>

    <g id="GameSection" transform="translate(32 536)" filter="url(#soft-shadow)">
      <rect width="366" height="172" rx="18" fill="#FFFDF7" stroke="#EAD9B8"/>
      <text x="18" y="31" fill="#3E2E1F" font-size="17" font-weight="900">등장 정보</text>
      <g font-size="12">
        <text x="18" y="62" fill="#8A735A" font-weight="800">등장작품</text>
        <text x="116" y="62" fill="#3E2E1F" font-weight="900">튀동숲 · 해피홈 · 포켓캠프</text>
        <text x="116" y="82" fill="#3E2E1F" font-weight="900">모여봐요 동물의 숲</text>
        <path d="M18 100h330" stroke="#EAD9B8"/>
        <text x="18" y="124" fill="#8A735A" font-weight="800">데뷔작</text>
        <text x="116" y="124" fill="#3E2E1F" font-weight="900">튀어나와요 동물의 숲</text>
        <path d="M18 140h330" stroke="#EAD9B8"/>
        <text x="18" y="160" fill="#8A735A" font-weight="800">섬 주민 가능 여부</text>
        <text x="170" y="160" fill="#2F7D4C" font-weight="900">가능</text>
      </g>
    </g>

    <g id="WordsSection" transform="translate(32 730)" filter="url(#soft-shadow)">
      <rect width="366" height="142" rx="18" fill="#FFFDF7" stroke="#EAD9B8"/>
      <text x="18" y="31" fill="#3E2E1F" font-size="17" font-weight="900">대화 정보</text>
      <g font-size="12">
        <text x="18" y="64" fill="#8A735A" font-weight="800">말버릇</text>
        <text x="116" y="64" fill="#3E2E1F" font-weight="900">어차피</text>
        <path d="M18 82h330" stroke="#EAD9B8"/>
        <text x="18" y="106" fill="#8A735A" font-weight="800">좋아하는 말</text>
        <text x="116" y="106" fill="#3E2E1F" font-weight="900">천재일우</text>
        <text x="116" y="126" fill="#8A735A" font-weight="800">Seize the day.</text>
      </g>
    </g>

    <g id="PreferenceSection" transform="translate(32 894)" filter="url(#soft-shadow)">
      <rect width="366" height="190" rx="18" fill="#FFFDF7" stroke="#EAD9B8"/>
      <text x="18" y="31" fill="#3E2E1F" font-size="17" font-weight="900">취향</text>
      <g id="StyleChips" transform="translate(18 52)" font-size="12" font-weight="900">
        <text y="18" fill="#8A735A">좋아하는 스타일</text>
        <g transform="translate(0 30)">
          <rect width="94" height="30" rx="15" fill="#FFF8EA" stroke="#D8C9AA"/>
          <text x="47" y="20" text-anchor="middle" fill="#6D4B25">엘레강트</text>
        </g>
        <g transform="translate(104 30)">
          <rect width="58" height="30" rx="15" fill="#EEF5FF" stroke="#C4D5EC"/>
          <text x="29" y="20" text-anchor="middle" fill="#496888">쿨</text>
        </g>
      </g>
      <g id="ColorChips" transform="translate(18 122)" font-size="12" font-weight="900">
        <text y="18" fill="#8A735A">좋아하는 색</text>
        <g transform="translate(0 30)">
          <rect width="122" height="30" rx="15" fill="#FFFFFF" stroke="#C8D9B9"/>
          <circle cx="18" cy="15" r="6" fill="#60D6D8"/>
          <text x="67" y="20" text-anchor="middle" fill="#5B716F">아쿠아 (Aqua)</text>
        </g>
        <g transform="translate(134 30)">
          <rect width="106" height="30" rx="15" fill="#FFFFFF" stroke="#C8D9B9"/>
          <circle cx="18" cy="15" r="6" fill="#4B83E6"/>
          <text x="60" y="20" text-anchor="middle" fill="#5B6375">파랑 (Blue)</text>
        </g>
      </g>
    </g>

    <g id="FavoriteItemsSection" transform="translate(32 1106)" filter="url(#soft-shadow)">
      <rect width="366" height="184" rx="18" fill="#FFFDF7" stroke="#EAD9B8"/>
      <text x="18" y="31" fill="#3E2E1F" font-size="17" font-weight="900">좋아하는 음악과 기본 아이템</text>
      <g transform="translate(18 52)">
        <g id="MusicItem">
          <rect width="102" height="96" rx="12" fill="#EEF5FF" stroke="#C4D5EC"/>
          <use href="#icon-note" x="36" y="18" width="30" height="30" color="#496888"/>
          <text x="51" y="67" text-anchor="middle" fill="#3E2E1F" font-size="12" font-weight="900">K.K.보사</text>
          <text x="51" y="84" text-anchor="middle" fill="#8A735A" font-size="10" font-weight="800">음악 이미지</text>
        </g>
        <g id="DefaultClothing" transform="translate(122)">
          <rect width="102" height="96" rx="12" fill="#E8ECF4" stroke="#C4D5EC"/>
          <use href="#icon-shirt" x="36" y="18" width="30" height="30" color="#27344C"/>
          <text x="51" y="67" text-anchor="middle" fill="#3E2E1F" font-size="12" font-weight="900">패딩 조끼</text>
          <text x="51" y="84" text-anchor="middle" fill="#8A735A" font-size="10" font-weight="800">기본 옷</text>
        </g>
        <g id="DefaultUmbrella" transform="translate(244)">
          <rect width="102" height="96" rx="12" fill="#E7F7F7" stroke="#BBD9D5"/>
          <use href="#icon-umbrella" x="36" y="18" width="30" height="30" color="#4BBBC0"/>
          <text x="51" y="67" text-anchor="middle" fill="#3E2E1F" font-size="12" font-weight="900">레몬 우산</text>
          <text x="51" y="84" text-anchor="middle" fill="#8A735A" font-size="10" font-weight="800">기본 우산</text>
        </g>
      </g>
      <g transform="translate(18 158)" font-size="11" font-weight="800">
        <text x="0" y="0" fill="#8A735A">타이틀 색상</text>
        <rect x="74" y="-12" width="34" height="18" rx="9" fill="#FFFFFF" stroke="#D5C6A9"/>
        <text x="132" y="0" fill="#8A735A">텍스트 색상</text>
        <rect x="212" y="-12" width="34" height="18" rx="9" fill="#848484"/>
      </g>
    </g>

    <g id="HouseSection" transform="translate(32 1312)" filter="url(#soft-shadow)">
      <rect width="366" height="342" rx="18" fill="#FFFDF7" stroke="#EAD9B8"/>
      <text x="18" y="31" fill="#3E2E1F" font-size="17" font-weight="900">하우스</text>
      <g font-size="12">
        <text x="18" y="62" fill="#8A735A" font-weight="800">벽지</text>
        <text x="74" y="62" fill="#3E2E1F" font-weight="900">시크한 벽지</text>
        <text x="196" y="62" fill="#8A735A" font-weight="800">바닥</text>
        <text x="244" y="62" fill="#3E2E1F" font-weight="900">모던 우드 바닥</text>
        <path d="M18 80h330" stroke="#EAD9B8"/>
        <text x="18" y="104" fill="#8A735A" font-weight="800">가구</text>
        <text x="74" y="104" fill="#3E2E1F" font-weight="900">그랜드 피아노 · 더블 소파 · 축음기</text>
      </g>

      <g id="HouseExterior" transform="translate(18 130)">
        <rect width="150" height="96" rx="10" fill="#F2F6ED" stroke="#C8D9B9"/>
        <path d="M24 66h96v22H24Z" fill="#EEE7D8" stroke="#BDAE91"/>
        <path d="M18 66 75 22l57 44Z" fill="#7E8E91"/>
        <rect x="66" y="52" width="28" height="36" rx="5" fill="#315A5A"/>
        <rect x="34" y="62" width="22" height="26" rx="3" fill="#C8995C"/>
        <circle cx="75" cy="46" r="9" fill="#F7F1E3"/>
        <text x="0" y="120" fill="#6D4B25" font-size="12" font-weight="900">하우스 외관</text>
      </g>

      <g id="HouseInterior" transform="translate(198 130)">
        <rect width="150" height="96" rx="10" fill="#2B2430" stroke="#C8D9B9"/>
        <path d="M12 82h126L116 44H34Z" fill="#9A513E"/>
        <rect x="30" y="28" width="28" height="42" fill="#5A392C"/>
        <rect x="68" y="18" width="36" height="46" fill="#382E39"/>
        <rect x="108" y="50" width="20" height="20" rx="3" fill="#D2A77E"/>
        <circle cx="118" cy="76" r="10" fill="#F3EFE5"/>
        <text x="0" y="120" fill="#6D4B25" font-size="12" font-weight="900">하우스 내관</text>
      </g>
    </g>

    <g id="CollectiblesSection" transform="translate(32 1676)" filter="url(#soft-shadow)">
      <rect width="366" height="198" rx="18" fill="#FFFDF7" stroke="#EAD9B8"/>
      <text x="18" y="31" fill="#3E2E1F" font-size="17" font-weight="900">액자 이미지 / 포스터 이미지</text>

      <g id="PhotoCollectible" transform="translate(18 50)">
        <rect width="330" height="64" rx="12" fill="#FFF8EA" stroke="#E0CDAA"/>
        <rect x="14" y="9" width="48" height="46" rx="8" fill="#FFEFD5"/>
        <use href="#icon-photo" x="29" y="24" width="18" height="18" color="#1E2D2A"/>
        <text x="82" y="19" fill="#3E2E1F" font-size="12" font-weight="900">쭈니의 사진</text>
        <text x="82" y="36" fill="#8A735A" font-size="9.5" font-weight="800">판매가 10벨 · 구매가 비매품</text>
        <text x="82" y="50" fill="#8A735A" font-size="9.5" font-weight="800">획득방법 친밀도 보상</text>
        <text x="82" y="62" fill="#2F7D4C" font-size="9.5" font-weight="900">보유여부 보유</text>
      </g>

      <g id="PosterCollectible" transform="translate(18 124)">
        <rect width="330" height="64" rx="12" fill="#F1F8F6" stroke="#C8D9B9"/>
        <rect x="14" y="9" width="48" height="46" rx="8" fill="#E4F4E8"/>
        <rect x="29" y="17" width="18" height="30" rx="3" fill="#F5EFE8" stroke="#B6A18A"/>
        <circle cx="38" cy="30" r="7" fill="#D8C8B8"/>
        <text x="82" y="19" fill="#3E2E1F" font-size="12" font-weight="900">쭈니의 포스터</text>
        <text x="82" y="36" fill="#8A735A" font-size="9.5" font-weight="800">판매가 250벨 · 구매가 1,000벨</text>
        <text x="82" y="50" fill="#8A735A" font-size="9.5" font-weight="800">획득방법 파니의 섬 촬영</text>
        <text x="82" y="62" fill="#B26F53" font-size="9.5" font-weight="900">보유여부 미보유</text>
      </g>
    </g>
  </g>
</svg>
