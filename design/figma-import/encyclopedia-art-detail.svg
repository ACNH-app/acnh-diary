<svg xmlns="http://www.w3.org/2000/svg" width="430" height="1180" viewBox="0 0 430 1180" role="img" aria-labelledby="title desc">
  <title id="title">ACNH Diary 미술품 상세 화면</title>
  <desc id="desc">유명한 명화의 이미지, 가격, 획득방법, 진품/가품 여부, 작가 설명, 가품 구별방법과 보유 상태를 보여주는 상세 화면</desc>
  <defs>
    <linearGradient id="page-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF9E8"/><stop offset="1" stop-color="#F3E8D4"/></linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#70562F" flood-opacity="0.09"/></filter>
    <symbol id="icon-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="m7.5 12.2 3 3.1 6-7" fill="none" stroke="#FFFDF7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-owl" viewBox="0 0 24 24"><path d="M5 10c0-4 3-7 7-7s7 3 7 7v7.5c0 2-1.5 3.5-3.5 3.5h-7C6.5 21 5 19.5 5 17.5Z" fill="currentColor"/><circle cx="9.2" cy="10.5" r="2.2" fill="#FFFDF7"/><circle cx="14.8" cy="10.5" r="2.2" fill="#FFFDF7"/><path d="m10.5 14 1.5 1.6 1.5-1.6Z" fill="#FFFDF7"/></symbol>
    <symbol id="item-art" viewBox="0 0 96 96"><rect x="24" y="12" width="48" height="72" rx="5" fill="currentColor"/><circle cx="48" cy="40" r="15" fill="#FFFDF7" opacity=".8"/><path d="M34 74h28" stroke="#FFFDF7" stroke-width="4" stroke-linecap="round"/></symbol>
  </defs>
  <g id="Screen/Encyclopedia/ArtDetail" font-family="Inter, Noto Sans KR, sans-serif">
    <rect width="430" height="1180" fill="url(#page-bg)"/><circle cx="366" cy="78" r="112" fill="#FFF0C9" fill-opacity=".8"/>
    <g id="Header" transform="translate(24 20)"><g role="button" tabindex="0"><title>미술품 목록으로 돌아가기</title><rect width="40" height="34" rx="17" fill="#FFFDF7" stroke="#EAD9B8"/><path d="M24 11 16 17l8 6" fill="none" stroke="#6D4B25" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="54" y="22" fill="#8A735A" font-size="12" font-weight="900">도감</text><path d="m87 13 5 5-5 5" fill="none" stroke="#B8A284" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><rect x="104" y="2" width="74" height="30" rx="15" fill="#FFF0C9" stroke="#E0CDAA"/><text x="141" y="22" text-anchor="middle" fill="#8A641C" font-size="12" font-weight="900">미술품</text><path d="m192 13 5 5-5 5" fill="none" stroke="#B8A284" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="210" y="22" fill="#6D4B25" font-size="12" font-weight="900">유명한 명화</text><g id="HamburgerMenu" transform="translate(342 0)" role="button" tabindex="0"><title>전체 메뉴 열기</title><rect width="40" height="34" rx="17" fill="#FFFDF7" stroke="#EAD9B8"/><path d="M12 11h16M12 17h16M12 23h16" fill="none" stroke="#6D4B25" stroke-width="2" stroke-linecap="round"/></g><text x="0" y="80" fill="#8A735A" font-size="12" font-weight="900">002 · 그림 · 가품 있음</text><text x="0" y="112" fill="#3E2E1F" font-size="30" font-weight="900">유명한 명화</text></g>
    <g id="Hero" transform="translate(32 148)" filter="url(#soft-shadow)"><rect width="366" height="250" rx="22" fill="#FFFDF7" stroke="#EAD9B8"/><rect x="18" y="18" width="156" height="156" rx="16" fill="#FFF8EA" stroke="#E0CDAA"/><use href="#item-art" x="48" y="40" width="96" height="96" color="#A58666"/><text x="196" y="54" fill="#8A735A" font-size="12" font-weight="800">가품여부</text><text x="196" y="80" fill="#B26F53" font-size="16" font-weight="900">가품 있음</text><text x="196" y="116" fill="#8A735A" font-size="12" font-weight="800">사이즈</text><text x="196" y="140" fill="#3E2E1F" font-size="14" font-weight="900">1.0 x 1.0</text><g transform="translate(18 194)" font-size="12" font-weight="900"><g role="button" tabindex="0"><title>진품 보유 여부 토글</title><rect width="104" height="38" rx="19" fill="#FFF0C9"/><use href="#icon-check" x="14" y="9" width="20" height="20" color="#D39C25"/><text x="44" y="25" fill="#8A641C">진품 보유</text></g><g transform="translate(120)" role="button" tabindex="0"><title>박물관 기증 여부 토글</title><rect width="106" height="38" rx="19" fill="#FFF0C9"/><use href="#icon-owl" x="14" y="9" width="20" height="20" color="#D39C25"/><text x="44" y="25" fill="#8A641C">박물관 기증</text></g><g transform="translate(242)" role="button" tabindex="0"><title>가품 보유 여부 토글</title><rect width="88" height="38" rx="19" fill="#FFFDF7" stroke="#EAD9B8"/><text x="44" y="25" text-anchor="middle" fill="#6D4B25">가품 보유</text></g></g></g>
    <g id="TradeInfo" transform="translate(32 420)" filter="url(#soft-shadow)"><rect width="366" height="150" rx="18" fill="#FFFDF7" stroke="#EAD9B8"/><text x="18" y="31" fill="#3E2E1F" font-size="17" font-weight="900">거래 정보</text><g font-size="12"><text x="18" y="64" fill="#8A735A" font-weight="800">구매가</text><text x="128" y="64" fill="#3E2E1F" font-weight="900">4,980벨</text><path d="M18 82h330" stroke="#EAD9B8"/><text x="18" y="106" fill="#8A735A" font-weight="800">판매가</text><text x="128" y="106" fill="#3E2E1F" font-weight="900">1,245벨</text><path d="M18 124h330" stroke="#EAD9B8"/><text x="18" y="142" fill="#8A735A" font-weight="800">획득방법</text><text x="128" y="142" fill="#3E2E1F" font-weight="900">여욱의 배</text></g></g>
    <g id="ArtworkInfo" transform="translate(32 592)" filter="url(#soft-shadow)"><rect width="366" height="210" rx="18" fill="#FFFDF7" stroke="#EAD9B8"/><text x="18" y="31" fill="#3E2E1F" font-size="17" font-weight="900">작품 설명</text><g font-size="12"><text x="18" y="64" fill="#8A735A" font-weight="800">art_name</text><text x="128" y="64" fill="#3E2E1F" font-weight="900">Mona Lisa</text><path d="M18 82h330" stroke="#EAD9B8"/><text x="18" y="106" fill="#8A735A" font-weight="800">style / type</text><text x="128" y="106" fill="#3E2E1F" font-weight="900">Renaissance · Painting</text><path d="M18 124h330" stroke="#EAD9B8"/><text x="18" y="148" fill="#8A735A" font-weight="800">author</text><text x="128" y="148" fill="#3E2E1F" font-weight="900">Leonardo da Vinci</text><text x="18" y="178" fill="#8A735A" font-weight="800">설명</text><text x="128" y="178" fill="#3E2E1F" font-weight="900">신비로운 미소로 유명한 초상화</text></g></g>
    <g id="FakeGuide" transform="translate(32 824)" filter="url(#soft-shadow)"><rect width="366" height="210" rx="18" fill="#FFFDF7" stroke="#EAD9B8"/><text x="18" y="31" fill="#3E2E1F" font-size="17" font-weight="900">가품 구별방법</text><rect x="18" y="52" width="148" height="106" rx="14" fill="#FFF8EA" stroke="#E0CDAA"/><use href="#item-art" x="44" y="58" width="96" height="96" color="#A58666"/><text x="188" y="70" fill="#8A735A" font-size="12" font-weight="800">차이점</text><text x="188" y="96" fill="#3E2E1F" font-size="12" font-weight="900">가품은 눈썹이 있습니다.</text><text x="188" y="126" fill="#8A735A" font-size="12" font-weight="800">구별 팁</text><text x="188" y="150" fill="#3E2E1F" font-size="12" font-weight="900">얼굴을 확대해 눈썹 확인</text><text x="18" y="188" fill="#B26F53" font-size="11" font-weight="900">가품 보유여부 미보유</text></g>
  </g>
</svg>
